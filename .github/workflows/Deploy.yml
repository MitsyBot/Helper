name: CI-CANARY

on:
  push:
    branches:
      - development

jobs:
  push_to_registry:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with: 
          submodules: true
          token: ${{ secrets.TOKEN }}

      - name: Docker builder
        uses: docker/setup-buildx-action@v1

      - name: Login GHCR
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN }}

      - name: Build Docker
        uses: docker/build-push-action@v2
        with:
          context: .
          version: latest
          file: Dockerfile
          push: true
          tags: ghcr.io/mitsybot/helper:latest
      - name: Enviar os arquivos para maquina da mitsy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            docker stop Helper
            docker rm Helper
            docker image rm ghcr.io/mitsybot/helper:latest
            docker pull ghcr.io/mitsybot/helper:latest
            docker run -it -d --restart=always -e BOT_TOKEN='${{ secrets.BOT_TOKEN }}' \
            --name Helper ghcr.io/mitsybot/helper:latest
